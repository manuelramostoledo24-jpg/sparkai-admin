<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SparkAI Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
body { background: linear-gradient(135deg, #0a1929 0%, #132f4c 100%); min-height: 100vh; color: #fff; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }
.header { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
.header h1 { color: #FFD700; font-size: 28px; margin-bottom: 5px; }
.header p { color: #00E5A0; font-size: 14px; }

.login-screen { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
.login-box { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 40px; text-align: center; width: 100%; max-width: 400px; border: 1px solid rgba(0,176,255,0.3); }
.login-box h2 { color: #FFD700; margin-bottom: 10px; font-size: 32px; }
.login-box p { color: #aaa; margin-bottom: 30px; }
.pin-input { width: 100%; padding: 16px; background: rgba(0,0,0,0.3); border: 2px solid rgba(0,176,255,0.3); border-radius: 12px; color: #fff; font-size: 18px; text-align: center; letter-spacing: 4px; margin-bottom: 20px; }
.pin-input:focus { outline: none; border-color: #00B0FF; }
.btn-login { width: 100%; padding: 14px; background: #00B0FF; border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
.btn-login:hover { background: #0099E5; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
.stat-card .value { font-size: 24px; font-weight: bold; color: #FFD700; }
.stat-card .label { font-size: 11px; color: #aaa; text-transform: uppercase; margin-top: 4px; }

.filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.filter-btn { padding: 8px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: #aaa; cursor: pointer; font-size: 13px; }
.filter-btn.active { background: #00B0FF; color: #fff; border-color: #00B0FF; }

.licenses { display: grid; gap: 12px; }
.license-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; border: 1px solid rgba(255,255,255,0.1); }
.license-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.license-email { color: #fff; font-weight: bold; font-size: 14px; }
.license-code { color: #00E5A0; font-family: monospace; font-size: 12px; margin-top: 4px; word-break: break-all; }
.status-badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
.status-active { background: rgba(0,230,118,0.2); color: #00E676; }
.status-pending { background: rgba(255,193,7,0.2); color: #FFC107; }
.status-expired { background: rgba(244,67,54,0.2); color: #F44336; }
.status-blocked { background: rgba(158,158,158,0.2); color: #9E9E9E; }
.license-info { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; font-size: 12px; color: #aaa; }
.info-item { display: flex; flex-direction: column; }
.info-item strong { color: #fff; }
.license-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 8px 14px; border: none; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; flex: 1; min-width: 100px; }
.btn-green { background: #00C853; color: #fff; }
.btn-yellow { background: #FFA000; color: #000; }
.btn-blue { background: #00B0FF; color: #fff; }
.btn-red { background: #F44336; color: #fff; }
.btn-gray { background: #555; color: #fff; }

.fab { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 50%; background: #00C853; color: #fff; font-size: 32px; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(0,200,83,0.4); }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
.modal-overlay.active { display: flex; }
.modal { background: #132f4c; border-radius: 20px; padding: 24px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; border: 1px solid rgba(0,176,255,0.3); }
.modal h2 { color: #FFD700; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; color: #aaa; font-size: 13px; margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 14px; }
.form-group input:focus, .form-group select:focus { outline: none; border-color: #00B0FF; }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }
.empty-state { text-align: center; padding: 60px 20px; color: #666; }

.logout-btn { position: absolute; top: 20px; right: 20px; padding: 8px 14px; background: rgba(244,67,54,0.2); color: #F44336; border: 1px solid #F44336; border-radius: 8px; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h2>⚡ SparkAI Admin</h2>
    <p>Ingresa tu contraseña</p>
    <input type="password" class="pin-input" id="pinInput" placeholder="••••••••" maxlength="30" autofocus>
    <button class="btn-login" onclick="login()">INGRESAR</button>
    <p id="loginError" style="color: #F44336; margin-top: 15px; display: none;">Contraseña incorrecta</p>
  </div>
</div>

<div id="dashboard" class="container" style="display:none; position:relative;">
  <button class="logout-btn" onclick="logout()">Salir</button>
  
  <div class="header">
    <h1>⚡ SparkAI Admin Panel</h1>
    <p>Gestión de licencias en tiempo real</p>
  </div>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all')">Todas</button>
    <button class="filter-btn" onclick="setFilter('active')">Activas</button>
    <button class="filter-btn" onclick="setFilter('pending')">Pendientes</button>
    <button class="filter-btn" onclick="setFilter('expired')">Expiradas</button>
    <button class="filter-btn" onclick="setFilter('blocked')">Bloqueadas</button>
  </div>

  <div class="licenses" id="licenses"></div>
</div>

<button class="fab" id="fabBtn" onclick="openCreateModal()" style="display:none;">+</button>

<div class="modal-overlay" id="createModal">
  <div class="modal">
    <h2>➕ Nueva Licencia</h2>
    <div class="form-group">
      <label>Email del Cliente</label>
      <input type="email" id="newEmail" placeholder="cliente@gmail.com">
    </div>
    <div class="form-group">
      <label>Método de Pago</label>
      <select id="newPayment">
        <option value="Zelle">Zelle</option>
        <option value="Cash App">Cash App</option>
        <option value="Efectivo">Efectivo</option>
        <option value="Otro">Otro</option>
      </select>
    </div>
    <div class="form-group">
      <label>Notas (opcional)</label>
      <textarea id="newNotes" rows="2" placeholder="Cliente recomendado por..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-gray" onclick="closeCreateModal()">Cancelar</button>
      <button class="btn btn-green" onclick="createLicense()">CREAR ($100)</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="logsModal">
  <div class="modal">
    <h2 id="logsTitle">📋 Logs</h2>
    <div id="logsContent"></div>
    <div class="modal-actions">
      <button class="btn btn-gray" onclick="closeLogsModal()">Cerrar</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://gqgiiwqillinmunkprdi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pivFIuIlTP0BbHxOLKCcVA_EPiWGd2D';
const ADMIN_PASSWORD = 'Manuel2026';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentFilter = 'all';
let licensesCache = [];

window.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('sparkai_admin_session') === 'authenticated') {
    showDashboard();
  }
  document.getElementById('pinInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') login();
  });
});

function login() {
  const pin = document.getElementById('pinInput').value;
  if (pin === ADMIN_PASSWORD) {
    localStorage.setItem('sparkai_admin_session', 'authenticated');
    showDashboard();
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('pinInput').value = '';
  }
}

function logout() {
  if (confirm('¿Cerrar sesión?')) {
    localStorage.removeItem('sparkai_admin_session');
    location.reload();
  }
}

function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('fabBtn').style.display = 'flex';
  loadLicenses();
  setInterval(loadLicenses, 30000);
}

async function loadLicenses() {
  try {
    const { data, error } = await supabase
      .from('licenses')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) throw error;
    licensesCache = data || [];
    renderStats();
    renderLicenses();
  } catch (e) {
    console.error('Error loading:', e);
  }
}

function renderStats() {
  const total = licensesCache.length;
  const active = licensesCache.filter(l => l.status === 'active').length;
  const expired = licensesCache.filter(l => l.status === 'expired').length;
  const blocked = licensesCache.filter(l => l.status === 'blocked').length;
  const revenue = licensesCache.reduce((sum, l) => sum + (parseFloat(l.paid_amount) || 0), 0);

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="value">${total}</div><div class="label">Total</div></div>
    <div class="stat-card"><div class="value" style="color:#00E676;">${active}</div><div class="label">Activas</div></div>
    <div class="stat-card"><div class="value" style="color:#F44336;">${expired}</div><div class="label">Expiradas</div></div>
    <div class="stat-card"><div class="value" style="color:#9E9E9E;">${blocked}</div><div class="label">Bloqueadas</div></div>
    <div class="stat-card"><div class="value" style="color:#00E5A0;">$${revenue.toFixed(0)}</div><div class="label">Ingresos</div></div>
  `;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderLicenses();
}

function renderLicenses() {
  let filtered = licensesCache;
  if (currentFilter !== 'all') {
    filtered = licensesCache.filter(l => l.status === currentFilter);
  }

  if (filtered.length === 0) {
    document.getElementById('licenses').innerHTML = '<div class="empty-state">No hay licencias para mostrar</div>';
    return;
  }

  document.getElementById('licenses').innerHTML = filtered.map(l => {
    const daysLeft = l.expires_at ? Math.max(0, Math.ceil((new Date(l.expires_at) - new Date()) / (1000*60*60*24))) : '-';
    const isBlocked = l.status === 'blocked';
    return `
      <div class="license-card">
        <div class="license-header">
          <div>
            <div class="license-email">${l.email}</div>
            <div class="license-code">${l.code}</div>
          </div>
          <div class="status-badge status-${l.status}">${l.status}</div>
        </div>
        <div class="license-info">
          <div class="info-item"><span>Días restantes</span><strong>${daysLeft}</strong></div>
          <div class="info-item"><span>Dispositivo</span><strong>${l.device_name || 'No activado'}</strong></div>
          <div class="info-item"><span>Pagado</span><strong>$${l.paid_amount || 0}</strong></div>
        </div>
        <div class="license-actions">
          <button class="btn btn-green" onclick="renewLicense('${l.id}')">🔄 Renovar +$30</button>
          <button class="btn btn-blue" onclick="resetDevice('${l.id}', '${l.email}')">📱 Resetear Device</button>
          <button class="btn ${isBlocked ? 'btn-yellow' : 'btn-red'}" onclick="toggleBlock('${l.id}', ${isBlocked})">${isBlocked ? '✅ Desbloquear' : '🚫 Bloquear'}</button>
          <button class="btn btn-gray" onclick="viewLogs('${l.id}', '${l.email}')">📋 Logs</button>
          <button class="btn btn-red" onclick="deleteLicense('${l.id}', '${l.email}')">🗑️ Eliminar</button>
        </div>
      </div>
    `;
  }).join('');
}

function openCreateModal() {
  document.getElementById('createModal').classList.add('active');
}

function closeCreateModal() {
  document.getElementById('createModal').classList.remove('active');
  document.getElementById('newEmail').value = '';
  document.getElementById('newNotes').value = '';
}

function generateCode() {
  const chars = '0123456789ABCDEF';
  let code = 'SPARKAI';
  for (let i = 0; i < 3; i++) {
    code += '-';
    for (let j = 0; j < 4; j++) {
      code += chars[Math.floor(Math.random() * chars.length)];
    }
  }
  return code;
}

async function createLicense() {
  const email = document.getElementById('newEmail').value.trim().toLowerCase();
  const payment = document.getElementById('newPayment').value;
  const notes = document.getElementById('newNotes').value.trim();

  if (!email || !email.includes('@')) {
    alert('Ingresa un email válido');
    return;
  }

  const code = generateCode();

  try {
    const { error } = await supabase.from('licenses').insert({
      email, code, status: 'pending',
      paid_amount: 100, payment_method: payment, notes: notes || null
    });
    if (error) throw error;
    
    try {
      await navigator.clipboard.writeText(code);
      alert(`✅ Licencia creada!\n\nCódigo (copiado al portapapeles):\n${code}\n\nMándaselo al cliente.`);
    } catch {
      alert(`✅ Licencia creada!\n\nCódigo:\n${code}\n\nCópialo y mándaselo al cliente.`);
    }
    
    closeCreateModal();
    loadLicenses();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function renewLicense(id) {
  if (!confirm('¿Renovar por 7 días más? (suma $30 al total pagado)')) return;
  
  const license = licensesCache.find(l => l.id === id);
  const newPaid = (parseFloat(license.paid_amount) || 0) + 30;

  try {
    const { error } = await supabase.from('licenses').update({
      device_id: null, device_name: null, activated_at: null, expires_at: null,
      status: 'pending', paid_amount: newPaid
    }).eq('id', id);
    if (error) throw error;
    alert('✅ Licencia renovada! El cliente puede reactivar con su mismo código.');
    loadLicenses();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function resetDevice(id, email) {
  if (!confirm(`¿Resetear el dispositivo de ${email}?\n\nEl cliente podrá reactivar con su mismo código en CUALQUIER dispositivo.\n\nNO suma dinero, solo limpia el device_id.`)) return;

  try {
    const { error } = await supabase.from('licenses').update({
      device_id: null, device_name: null
    }).eq('id', id);
    if (error) throw error;
    alert('✅ Device reseteado!\n\nEl cliente puede reactivar inmediatamente con su mismo código.');
    loadLicenses();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function toggleBlock(id, isBlocked) {
  const newStatus = isBlocked ? 'pending' : 'blocked';
  const msg = isBlocked ? '¿Desbloquear?' : '¿Bloquear? El cliente perderá acceso.';
  if (!confirm(msg)) return;

  try {
    const { error } = await supabase.from('licenses').update({ status: newStatus }).eq('id', id);
    if (error) throw error;
    loadLicenses();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function deleteLicense(id, email) {
  if (!confirm(`¿ELIMINAR la licencia de ${email}?\n\nEsta acción NO se puede deshacer.`)) return;
  if (!confirm('¿Estás seguro? Última oportunidad.')) return;

  try {
    const { error } = await supabase.from('licenses').delete().eq('id', id);
    if (error) throw error;
    loadLicenses();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function viewLogs(id, email) {
  document.getElementById('logsTitle').textContent = `📋 Logs - ${email}`;
  document.getElementById('logsContent').innerHTML = '<p style="color:#aaa;">Cargando...</p>';
  document.getElementById('logsModal').classList.add('active');

  try {
    const { data, error } = await supabase
      .from('activation_logs')
      .select('*')
      .eq('license_id', id)
      .order('created_at', { ascending: false })
      .limit(20);
    if (error) throw error;

    if (!data || data.length === 0) {
      document.getElementById('logsContent').innerHTML = '<p style="color:#aaa;">No hay registros</p>';
      return;
    }

    document.getElementById('logsContent').innerHTML = data.map(log => `
      <div style="background:rgba(255,255,255,0.03); padding:10px; border-radius:8px; margin-bottom:8px; font-size:12px;">
        <div style="color:${log.success ? '#00E676' : '#F44336'}; font-weight:bold;">${log.action.toUpperCase()} - ${log.success ? '✅' : '❌'}</div>
        <div style="color:#aaa; margin-top:4px;">${new Date(log.created_at).toLocaleString()}</div>
        ${log.device_name ? `<div style="color:#fff; margin-top:4px;">📱 ${log.device_name}</div>` : ''}
        ${log.error_message ? `<div style="color:#F44336; margin-top:4px;">⚠️ ${log.error_message}</div>` : ''}
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('logsContent').innerHTML = `<p style="color:#F44336;">Error: ${e.message}</p>`;
  }
}

function closeLogsModal() {
  document.getElementById('logsModal').classList.remove('active');
}
</script>

</body>
</html>
