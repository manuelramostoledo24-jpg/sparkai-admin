<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SparkAI Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0e1a; color: #e8eaed; min-height: 100vh; padding-bottom: 100px;
  }
  #pinGate {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0a0e1a 0%, #1a1f3a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 9999; padding: 20px;
  }
  #pinGate.hidden { display: none; }
  .logo {
    font-size: 32px; font-weight: 800;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;
  }
  .tagline { color: #94a3b8; margin-bottom: 40px; font-size: 14px; }
  #pinInput {
    width: 280px; max-width: 86vw; padding: 14px; font-size: 14px; text-align: center; letter-spacing: 1px;
    background: #1e293b; border: 2px solid #334155; border-radius: 12px; color: #fff; margin-bottom: 16px; outline: none;
  }
  #pinInput:focus { border-color: #22d3ee; }
  #pinBtn {
    width: 280px; max-width: 86vw; padding: 14px; background: linear-gradient(135deg, #4ade80, #22d3ee);
    border: none; border-radius: 12px; color: #0a0e1a; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  #pinError { color: #ef4444; margin-top: 12px; font-size: 14px; min-height: 20px; text-align: center; }
  #app { padding: 16px; max-width: 900px; margin: 0 auto; }
  #app.hidden { display: none; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .header h1 {
    font-size: 22px; background: linear-gradient(135deg, #4ade80, #22d3ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .logout-btn {
    background: #1e293b; border: 1px solid #334155; color: #94a3b8;
    padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer;
  }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat { background: #1e293b; border-radius: 10px; padding: 12px 8px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 800; }
  .stat-label { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .stat.total .stat-num { color: #e8eaed; }
  .stat.online .stat-num { color: #22d3ee; }
  .stat.active .stat-num { color: #4ade80; }
  .stat.soon .stat-num { color: #fbbf24; }
  .stat.expired .stat-num { color: #f59e0b; }
  .stat.blocked .stat-num { color: #ef4444; }
  .alert-banner {
    background: #422006; color: #fbbf24; padding: 12px; border-radius: 8px;
    margin-bottom: 12px; font-size: 13px; font-weight: 700; border: 1px solid #a16207;
  }
  .alert-banner.hidden { display: none; }
  .top-ref { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 16px; border: 1px solid #334155; }
  .top-ref.hidden { display: none; }
  .top-ref h3 { font-size: 13px; color: #4ade80; margin-bottom: 8px; }
  .ref-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; padding: 6px 0; border-bottom: 1px solid #0f172a;
  }
  .ref-row:last-child { border-bottom: none; }
  .ref-row .cnt { color: #4ade80; font-weight: 700; white-space: nowrap; }
  .ref-row .em { color: #e8eaed; word-break: break-all; margin-right: 8px; }
  #searchBox {
    width: 100%; padding: 12px; margin-bottom: 12px; background: #1e293b;
    border: 1px solid #334155; border-radius: 10px; color: #e8eaed; font-size: 14px; outline: none;
  }
  #searchBox:focus { border-color: #22d3ee; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
  .tab {
    flex: 1; min-width: 72px; padding: 9px 6px; text-align: center; font-size: 12px;
    font-weight: 600; white-space: nowrap; background: #1e293b; border: 1px solid #334155;
    border-radius: 8px; color: #94a3b8; cursor: pointer;
  }
  .tab.active { background: #064e3b; color: #4ade80; border-color: #4ade80; }
  #licensesList { display: flex; flex-direction: column; gap: 12px; }
  .license-card { background: #1e293b; border-radius: 12px; padding: 16px; border-left: 4px solid #334155; }
  .license-card.active { border-left-color: #4ade80; }
  .license-card.expiring { border-left-color: #fbbf24; }
  .license-card.expired { border-left-color: #f59e0b; }
  .license-card.blocked { border-left-color: #ef4444; }
  .license-card.paused { border-left-color: #94a3b8; }
  .lic-top { display: flex; justify-content: space-between; align-items: center; }
  .lic-email { font-size: 14px; color: #e8eaed; margin-bottom: 4px; word-break: break-all; }
  .lic-code { font-family: "Courier New", monospace; font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
  .live-dot {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
    white-space: nowrap; padding: 4px 8px; border-radius: 12px;
  }
  .live-dot.online { background: #064e3b; color: #4ade80; }
  .live-dot.offline { background: #1f2937; color: #94a3b8; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.on { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  .dot.off { background: #64748b; }
  .lic-meta {
    display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: #94a3b8;
    margin-bottom: 10px; margin-top: 8px;
  }
  .lic-meta span { background: #0f172a; padding: 4px 8px; border-radius: 6px; }
  .lic-meta span.ref { background: #064e3b; color: #4ade80; font-weight: 700; }
  .lic-meta span.warn { background: #422006; color: #fbbf24; font-weight: 700; }
  .lic-meta span.refby { background: #1e3a8a; color: #93c5fd; }
  .lic-meta span.paused { background: #334155; color: #cbd5e1; font-weight: 700; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .badge.active { background: #064e3b; color: #4ade80; }
  .badge.expiring { background: #422006; color: #fbbf24; }
  .badge.expired { background: #78350f; color: #fbbf24; }
  .badge.blocked { background: #7f1d1d; color: #fca5a5; }
  .badge.paused { background: #334155; color: #cbd5e1; }
  .lic-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 10px; }
  .act-btn { padding: 8px; font-size: 12px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; background: #334155; color: #e8eaed; }
  .act-btn.renew { background: #064e3b; color: #4ade80; }
  .act-btn.block { background: #7f1d1d; color: #fca5a5; }
  .act-btn.unblock { background: #1e3a8a; color: #93c5fd; }
  .act-btn.reset { background: #422006; color: #fbbf24; }
  .act-btn.pause { background: #422006; color: #fdba74; }
  .act-btn.resume { background: #064e3b; color: #4ade80; }
  .act-btn.addtime { background: #1e3a8a; color: #93c5fd; }
  .act-btn.stats { background: #312e81; color: #c7d2fe; grid-column: span 2; }
  .act-btn.delete { background: #450a0a; color: #f87171; grid-column: span 2; }
  .act-btn.logs { background: #1e293b; color: #94a3b8; grid-column: span 2; border: 1px solid #334155; }
  .fab {
    position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px;
    background: linear-gradient(135deg, #4ade80, #22d3ee); border: none; border-radius: 50%;
    color: #0a0e1a; font-size: 32px; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 24px rgba(34, 211, 238, 0.4); z-index: 100;
  }
  .fab.hidden { display: none; }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
  }
  .modal-bg.hidden { display: none; }
  .modal { background: #1e293b; border-radius: 16px; padding: 24px; max-width: 400px; width: 100%; max-height: 80vh; overflow-y: auto; }
  .modal h2 { margin-bottom: 16px; font-size: 18px; word-break: break-all; }
  .modal input, .modal select {
    width: 100%; padding: 12px; margin-bottom: 12px; background: #0f172a;
    border: 1px solid #334155; border-radius: 8px; color: #e8eaed; font-size: 14px;
  }
  .modal label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
  .modal-btns { display: flex; gap: 8px; margin-top: 12px; }
  .modal-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
  .btn-primary { background: linear-gradient(135deg, #4ade80, #22d3ee); color: #0a0e1a; }
  .btn-secondary { background: #334155; color: #e8eaed; }
  #loading { text-align: center; padding: 40px 20px; color: #94a3b8; }
  #errorBanner { background: #7f1d1d; color: #fca5a5; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
  #errorBanner.hidden { display: none; }
  .empty { text-align: center; padding: 40px 20px; color: #64748b; }
  .logs-list { max-height: 60vh; overflow-y: auto; }
  .log-entry { padding: 10px; background: #0f172a; border-radius: 6px; margin-bottom: 6px; font-size: 12px; }
  .log-entry.success { border-left: 3px solid #4ade80; }
  .log-entry.fail { border-left: 3px solid #ef4444; }
  .log-action { font-weight: 700; color: #e8eaed; }
  .log-time { color: #64748b; font-size: 10px; margin-top: 2px; }
  .log-detail { color: #94a3b8; margin-top: 4px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .sbox { background: #0f172a; border-radius: 8px; padding: 10px 6px; text-align: center; }
  .sn { font-size: 16px; font-weight: 800; color: #4ade80; }
  .sl { font-size: 10px; color: #94a3b8; margin-top: 2px; }
  .order-row {
    display: flex; justify-content: space-between; gap: 8px; font-size: 11px;
    padding: 6px 8px; background: #0f172a; border-radius: 6px; margin-bottom: 4px;
  }
  .order-row .ot { color: #64748b; white-space: nowrap; }
</style>
</head>
<body>
<div id="pinGate">
  <div class="logo" translate="no">SparkAI</div>
  <div class="tagline" translate="no">Admin Panel</div>
  <input type="password" id="pinInput" placeholder="Admin Key" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="pinBtn" type="button">UNLOCK</button>
  <div id="pinError"></div>
</div>
<div id="app" class="hidden">
  <div class="header">
    <h1 translate="no">SparkAI Licenses</h1>
    <button class="logout-btn" type="button" onclick="logout()">Lock</button>
  </div>
  <div id="errorBanner" class="hidden"></div>
  <div id="alertBanner" class="alert-banner hidden"></div>
  <div class="stats">
    <div class="stat total"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total</div></div>
    <div class="stat online"><div class="stat-num" id="statOnline">0</div><div class="stat-label">En línea</div></div>
    <div class="stat active"><div class="stat-num" id="statActive">0</div><div class="stat-label">Active</div></div>
    <div class="stat soon"><div class="stat-num" id="statSoon">0</div><div class="stat-label">Por vencer</div></div>
    <div class="stat expired"><div class="stat-num" id="statExpired">0</div><div class="stat-label">Expired</div></div>
    <div class="stat blocked"><div class="stat-num" id="statBlocked">0</div><div class="stat-label">Blocked</div></div>
  </div>
  <div id="topRef" class="top-ref hidden"></div>
  <input id="searchBox" type="text" placeholder="🔍 Buscar por email o código" autocomplete="off" oninput="onSearch(this.value)">
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="all" onclick="setTab('all')">Todos</div>
    <div class="tab" data-tab="active" onclick="setTab('active')">Activos</div>
    <div class="tab" data-tab="expired" onclick="setTab('expired')">Expirados</div>
    <div class="tab" data-tab="blocked" onclick="setTab('blocked')">Bloqueados</div>
  </div>
  <div id="loading">Loading licenses...</div>
  <div id="licensesList"></div>
</div>
<button class="fab hidden" id="fabBtn" type="button" onclick="openCreateModal()">+</button>
<div class="modal-bg hidden" id="createModal">
  <div class="modal">
    <h2>New License</h2>
    <input type="email" id="newEmail" placeholder="client@email.com" autocomplete="off">
    <input type="text" id="newCode" readonly style="background:#0a0e1a;color:#22d3ee;font-family:monospace;">
    <select id="newPayment">
      <option value="Cash">Cash</option>
      <option value="Zelle">Zelle</option>
      <option value="CashApp">CashApp</option>
      <option value="Venmo">Venmo</option>
      <option value="Other">Other</option>
    </select>
    <input type="text" id="newNotes" placeholder="Notes (optional)">
    <label>🎁 Referido por (email de quien lo refirió) — opcional</label>
    <input type="email" id="newReferredBy" placeholder="referrer@email.com" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-secondary" type="button" onclick="closeCreateModal()">Cancel</button>
      <button class="btn-primary" type="button" onclick="createLicense()">Create ($150)</button>
    </div>
  </div>
</div>
<div class="modal-bg hidden" id="logsModal">
  <div class="modal">
    <h2>Activity Log</h2>
    <div class="logs-list" id="logsList"></div>
    <div class="modal-btns">
      <button class="btn-secondary" type="button" onclick="closeLogsModal()">Close</button>
    </div>
  </div>
</div>
<div class="modal-bg hidden" id="statsModal">
  <div class="modal">
    <h2 id="statsTitle">Stats</h2>
    <div id="statsBody" style="max-height:62vh;overflow-y:auto;">Loading...</div>
    <div class="modal-btns">
      <button class="btn-secondary" type="button" onclick="closeStatsModal()">Close</button>
    </div>
  </div>
</div>
<script>
"use strict";
var SUPABASE_URL = "https://gqgiiwqillinmunkprdi.supabase.co";
var SUPABASE_KEY = "sb_publishable_pivFIuIlTP0BbHxOLKCcVA_EPiWGd2D";
var ADMIN_API_URL = SUPABASE_URL + "/functions/v1/admin-api";
var ADMIN_KEY = "";
var WEEK_MS = 7 * 24 * 60 * 60 * 1000;
var DAY_MS = 24 * 60 * 60 * 1000;
var ONLINE_MS = 6 * 60 * 1000;
var ALERT_DAYS = 2;
var licenses = [];
var refreshTimer = null;
var currentTab = "all";
var currentSearch = "";

// Todas las llamadas pasan por admin-api con la llave admin real.
function callAdmin(action, payload) {
  var body = payload || {};
  body.action = action;
  return fetch(ADMIN_API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "x-admin-key": ADMIN_KEY },
    body: JSON.stringify(body)
  }).then(function(r){
    if (r.status === 401) { handleUnauthorized(); throw new Error("unauthorized"); }
    if (!r.ok) return r.text().then(function(t){ throw new Error("HTTP " + r.status + " " + t); });
    return r.json();
  });
}

function handleUnauthorized() {
  try { sessionStorage.removeItem("sparkai_admin_key"); } catch(e){}
  ADMIN_KEY = "";
  if (refreshTimer) clearInterval(refreshTimer);
  document.getElementById("app").classList.add("hidden");
  document.getElementById("fabBtn").classList.add("hidden");
  document.getElementById("pinGate").classList.remove("hidden");
  var err = document.getElementById("pinError");
  if (err) err.textContent = "Sesión expirada, ingresa la llave de nuevo";
}

function checkPin() {
  var input = document.getElementById("pinInput");
  var err = document.getElementById("pinError");
  var val = (input.value || "").trim();
  if (!val) { err.textContent = "Ingresa la llave"; return; }
  err.textContent = "Verificando...";
  ADMIN_KEY = val;
  callAdmin("list_licenses")
  .then(function(resp){
    try { sessionStorage.setItem("sparkai_admin_key", ADMIN_KEY); } catch(e){}
    err.textContent = "";
    document.getElementById("pinGate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("fabBtn").classList.remove("hidden");
    licenses = resp.licenses || [];
    render();
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(loadLicenses, 30000);
  })
  .catch(function(e){
    ADMIN_KEY = "";
    err.textContent = (e.message === "unauthorized") ? "Llave incorrecta" : ("Error: " + e.message);
    input.value = ""; input.focus();
  });
}
function logout() {
  try { sessionStorage.removeItem("sparkai_admin_key"); } catch(e){}
  if (refreshTimer) clearInterval(refreshTimer);
  location.reload();
}
function startAutoRefresh() {
  loadLicenses();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(loadLicenses, 30000);
}
function showError(msg) {
  var el = document.getElementById("errorBanner");
  el.textContent = msg; el.classList.remove("hidden");
  setTimeout(function(){ el.classList.add("hidden"); }, 5000);
}
function loadLicenses() {
  callAdmin("list_licenses")
  .then(function(resp){ licenses = resp.licenses || []; render(); })
  .catch(function(e){
    if (e.message === "unauthorized") return;
    showError("Load failed: " + e.message);
    document.getElementById("loading").textContent = "Failed to load. Check connection.";
  });
}
function isOnline(L, now) {
  if (!L.last_seen) return false;
  return (now - new Date(L.last_seen).getTime()) < ONLINE_MS;
}
function effectiveStatus(L, now) {
  if (L.paused) return "paused";
  var s = L.status || "unknown";
  if (s === "active") {
    var exp = L.expires_at ? new Date(L.expires_at).getTime() : 0;
    if (exp && exp < now) return "expired";
    return "active";
  }
  return s;
}
function remainingMsOf(L, now) {
  if (L.paused) return Number(L.remaining_ms || 0);
  if (!L.expires_at) return null;
  return new Date(L.expires_at).getTime() - now;
}
function fmtDuration(ms) {
  if (ms == null) return "—";
  if (ms < 0) ms = 0;
  var d = Math.floor(ms / 86400000);
  var h = Math.floor((ms % 86400000) / 3600000);
  var m = Math.floor((ms % 3600000) / 60000);
  if (d > 0) return d + "d " + h + "h";
  if (h > 0) return h + "h " + m + "m";
  return m + "m";
}
function daysLeftNum(L, now) {
  if (!L.expires_at) return null;
  return Math.ceil((new Date(L.expires_at).getTime() - now) / 86400000);
}
function isExpiringSoon(L, now) {
  if (effectiveStatus(L, now) !== "active") return false;
  var d = daysLeftNum(L, now);
  return d !== null && d <= ALERT_DAYS;
}
function sortKey(L, now) {
  if (effectiveStatus(L, now) === "blocked") return 9e15;
  if (effectiveStatus(L, now) === "paused") return 8.5e15;
  if (!L.expires_at) return 8e15;
  return new Date(L.expires_at).getTime();
}
function render() {
  document.getElementById("loading").style.display = "none";
  var now = Date.now();
  var total = licenses.length, active = 0, expired = 0, blocked = 0, online = 0, soon = 0;
  for (var i = 0; i < licenses.length; i++) {
    var L = licenses[i];
    if (isOnline(L, now)) online++;
    var es = effectiveStatus(L, now);
    if (es === "blocked") blocked++;
    else if (es === "expired") expired++;
    else if (es === "active") { active++; if (isExpiringSoon(L, now)) soon++; }
  }
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statOnline").textContent = online;
  document.getElementById("statActive").textContent = active;
  document.getElementById("statSoon").textContent = soon;
  document.getElementById("statExpired").textContent = expired;
  document.getElementById("statBlocked").textContent = blocked;

  var alertEl = document.getElementById("alertBanner");
  if (soon > 0) {
    alertEl.textContent = "⚠️ " + soon + (soon === 1 ? " cliente vence pronto (≤2 días)" : " clientes vencen pronto (≤2 días)");
    alertEl.classList.remove("hidden");
  } else { alertEl.classList.add("hidden"); }

  renderTopReferrers();

  var filtered = [];
  for (var j = 0; j < licenses.length; j++) {
    var lic = licenses[j];
    var st = effectiveStatus(lic, now);
    if (currentTab === "active" && st !== "active") continue;
    if (currentTab === "expired" && st !== "expired") continue;
    if (currentTab === "blocked" && st !== "blocked") continue;
    if (currentSearch) {
      var em = (lic.email || "").toLowerCase();
      var cd = (lic.code || "").toLowerCase();
      if (em.indexOf(currentSearch) < 0 && cd.indexOf(currentSearch) < 0) continue;
    }
    filtered.push(lic);
  }
  filtered.sort(function(a, b){ return sortKey(a, now) - sortKey(b, now); });

  var list = document.getElementById("licensesList");
  if (filtered.length === 0) { list.innerHTML = '<div class="empty">No hay clientes en esta vista.</div>'; return; }
  var html = "";
  for (var k = 0; k < filtered.length; k++) { html += renderCard(filtered[k], now); }
  list.innerHTML = html;
}
function renderTopReferrers() {
  var box = document.getElementById("topRef");
  var refs = [];
  for (var i = 0; i < licenses.length; i++) { if ((licenses[i].referral_count || 0) > 0) refs.push(licenses[i]); }
  if (refs.length === 0) { box.classList.add("hidden"); box.innerHTML = ""; return; }
  refs.sort(function(a, b){ return (b.referral_count || 0) - (a.referral_count || 0); });
  var max = Math.min(refs.length, 5);
  var html = '<h3>🏆 Top referidores</h3>';
  for (var j = 0; j < max; j++) {
    html += '<div class="ref-row"><span class="em">' + escapeHtml(refs[j].email || "") +
            '</span><span class="cnt">🎁 ' + (refs[j].referral_count || 0) + '</span></div>';
  }
  box.innerHTML = html; box.classList.remove("hidden");
}
function lastSeenText(L, now) {
  if (!L.last_seen) return "Nunca";
  var mins = Math.floor((now - new Date(L.last_seen).getTime()) / 60000);
  if (mins < 1) return "hace segundos";
  if (mins < 60) return "hace " + mins + " min";
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return "hace " + hrs + " h";
  return "hace " + Math.floor(hrs / 24) + " d";
}
function renderCard(L, now) {
  var es = effectiveStatus(L, now);
  var expiring = isExpiringSoon(L, now);
  var statusClass = es;
  if (expiring) statusClass = "active expiring";
  var badgeClass = expiring ? "expiring" : es;
  var badgeText = expiring ? "vence pronto" : (es === "paused" ? "en pausa" : es);

  var remMs = remainingMsOf(L, now);
  var daysHtml = "";
  if (es === "paused") {
    daysHtml = '<span class="paused">⏸ En pausa · ' + fmtDuration(remMs) + '</span>';
  } else if (es === "active") {
    var dnum = daysLeftNum(L, now);
    daysHtml = expiring
      ? '<span class="warn">⏰ ' + (dnum <= 0 ? "vence hoy" : "vence en " + dnum + "d") + '</span>'
      : '<span>' + fmtDuration(remMs) + ' left</span>';
  } else if (es === "expired") { daysHtml = '<span class="warn">Expired</span>'; }
  else if (es === "blocked") { daysHtml = '<span>Blocked</span>'; }

  var online = isOnline(L, now);
  var liveHtml = online
    ? '<span class="live-dot online"><span class="dot on"></span>EN LÍNEA</span>'
    : '<span class="live-dot offline"><span class="dot off"></span>' + lastSeenText(L, now) + '</span>';
  var paid = L.paid_amount || 0;
  var device = L.device_name || "Not bound";
  var created = L.created_at ? new Date(L.created_at).toLocaleDateString() : "";
  var refCount = L.referral_count || 0;
  var refHtml = refCount > 0 ? '<span class="ref">🎁 ' + refCount + ' ref</span>' : '';
  var refByHtml = L.referred_by ? '<span class="refby">Ref. por: ' + escapeHtml(L.referred_by) + '</span>' : '';

  var actions = "";
  if (es === "blocked") {
    actions += '<button class="act-btn unblock" onclick="unblockLicense(\'' + L.id + '\')">Unblock</button>';
    actions += '<button class="act-btn addtime" onclick="addTime(\'' + L.id + '\')">➕ Tiempo</button>';
  } else if (es === "paused") {
    actions += '<button class="act-btn resume" onclick="resumeLicense(\'' + L.id + '\')">▶ Reanudar</button>';
    actions += '<button class="act-btn addtime" onclick="addTime(\'' + L.id + '\')">➕ Tiempo</button>';
    actions += '<button class="act-btn block" onclick="blockLicense(\'' + L.id + '\')">Block</button>';
  } else {
    actions += '<button class="act-btn renew" onclick="renewLicense(\'' + L.id + '\')">Renew +$40</button>';
    actions += '<button class="act-btn pause" onclick="pauseLicense(\'' + L.id + '\')">⏸ Pausar</button>';
    actions += '<button class="act-btn addtime" onclick="addTime(\'' + L.id + '\')">➕ Tiempo</button>';
    actions += '<button class="act-btn block" onclick="blockLicense(\'' + L.id + '\')">Block</button>';
  }
  if (L.device_id) {
    actions += '<button class="act-btn reset" onclick="resetDevice(\'' + L.id + '\')">Reset Device</button>';
  }
  actions += '<button class="act-btn stats" onclick="viewStats(\'' + escapeAttr(L.email) + '\')">📊 Stats</button>';
  actions += '<button class="act-btn logs" onclick="viewLogs(\'' + escapeAttr(L.email) + '\')">View Logs</button>';
  actions += '<button class="act-btn delete" onclick="deleteLicense(\'' + L.id + '\',\'' + escapeAttr(L.email) + '\')">Delete</button>';

  return (
    '<div class="license-card ' + statusClass + '">' +
      '<div class="lic-top">' +
        '<div class="lic-email">' + escapeHtml(L.email || "") + '</div>' + liveHtml +
      '</div>' +
      '<div class="lic-code">' + escapeHtml(L.code || "") + '</div>' +
      '<div class="lic-meta">' +
        '<span class="badge ' + badgeClass + '">' + badgeText + '</span>' +
        daysHtml +
        '<span>$' + paid + '</span>' +
        '<span>' + escapeHtml(device) + '</span>' +
        '<span>Created: ' + created + '</span>' +
        refHtml + refByHtml +
      '</div>' +
      '<div class="lic-actions">' + actions + '</div>' +
    '</div>'
  );
}
function setTab(t) {
  currentTab = t;
  var tabs = document.querySelectorAll(".tab");
  for (var i = 0; i < tabs.length; i++) {
    if (tabs[i].getAttribute("data-tab") === t) tabs[i].classList.add("active");
    else tabs[i].classList.remove("active");
  }

}

// ===== STATS POR CLIENTE =====
function viewStats(email) {
  document.getElementById("statsModal").classList.remove("hidden");
  document.getElementById("statsTitle").textContent = email;
  document.getElementById("statsBody").innerHTML = "Loading...";
  Promise.all([
    callAdmin("get_orders", { email: email }).then(function(r){ return r.orders || []; }).catch(function(){ return []; }),
    callAdmin("get_sessions", { email: email }).then(function(r){ return r.sessions || []; }).catch(function(){ return []; })
  ]).then(function(res){
    renderStats(res[0] || [], res[1] || []);
  }).catch(function(e){
    document.getElementById("statsBody").innerHTML = '<div class="empty">Load failed: ' + e.message + '</div>';
  });
}
function renderStats(orders, sessions) {
  var n = orders.length;
  var total = 0;
  for (var i = 0; i < orders.length; i++) { total += parseFloat(orders[i].price) || 0; }
  var avg = n > 0 ? total / n : 0;

  var times = [];
  for (var j = 0; j < orders.length; j++) { if (orders[j].created_at) times.push(new Date(orders[j].created_at).getTime()); }
  times.sort(function(a, b){ return a - b; });
  var avgGap = "—";
  if (times.length >= 2) {
    var sum = 0;
    for (var k = 1; k < times.length; k++) { sum += (times[k] - times[k-1]); }
    avgGap = Math.round((sum / (times.length - 1)) / 60000) + " min";
  }

  var activeMs = 0;
  for (var s = 0; s < sessions.length; s++) {
    var se = sessions[s];
    if (se.started_at && se.ended_at) {
      activeMs += new Date(se.ended_at).getTime() - new Date(se.started_at).getTime();
    }
  }
  var activeH = Math.floor(activeMs / 3600000);
  var activeM = Math.floor((activeMs % 3600000) / 60000);

  var lastOrder = (orders.length > 0 && orders[0].created_at) ? new Date(orders[0].created_at).toLocaleString() : "—";

  var html = '<div class="stat-grid">';
  html += sbox(n, "Órdenes");
  html += sbox("$" + total.toFixed(2), "Monto total");
  html += sbox("$" + avg.toFixed(2), "Promedio");
  html += sbox(avgGap, "Entre órdenes");
  html += sbox(activeH + "h " + activeM + "m", "Bot activo");
  html += sbox(sessions.length, "Sesiones");
  html += '</div>';
  html += '<div style="font-size:11px;color:#94a3b8;margin:8px 0 12px;">Última orden: ' + lastOrder + '</div>';
  html += '<h3 style="font-size:13px;color:#4ade80;margin-bottom:6px;">Órdenes recientes</h3>';
  if (orders.length === 0) {
    html += '<div class="empty">Sin órdenes registradas aún.</div>';
  } else {
    var max = Math.min(orders.length, 25);
    for (var m = 0; m < max; m++) {
      var o = orders[m];
      var when = o.created_at ? new Date(o.created_at).toLocaleString() : "";
      var price = (parseFloat(o.price) || 0).toFixed(2);
      var detail = '<b>$' + price + '</b> · ' + escapeHtml(o.tipo || "—") + ' · ' + (o.millas || 0) + 'mi';
      if (o.store) detail += ' · ' + escapeHtml(o.store);
      html += '<div class="order-row"><div>' + detail + '</div><div class="ot">' + when + '</div></div>';
    }
  }
  document.getElementById("statsBody").innerHTML = html;
}
function sbox(num, label) {
  return '<div class="sbox"><div class="sn">' + num + '</div><div class="sl">' + label + '</div></div>';
}
function closeStatsModal() { document.getElementById("statsModal").classList.add("hidden"); }

  .then(function(){ loadLicenses(); })
  .catch(function(e){ if (e.message !== "unauthorized") showError("Renew failed: " + e.message); });
}

function addTime(id) {
  var v = prompt("¿Cuántos días agregar? (puedes usar decimales, ej. 0.5 = 12h)");
  if (v === null) return;
  var days = parseFloat(v);
  if (isNaN(days) || days <= 0) { alert("Número inválido"); return; }
  var addMs = Math.round(days * DAY_MS);
  callAdmin("add_time", { id: id, addMs: addMs })
  .then(function(){ loadLicenses(); })
  .catch(function(e){ if (e.message !== "unauthorized") showError("Add time failed: " + e.message); });
}
function viewLogs(email) {
  document.getElementById("logsModal").classList.remove("hidden");
  document.getElementById("logsList").innerHTML = "Loading...";
  callAdmin("get_logs", { email: email })
  .then(function(resp){
    var logs = resp.logs || [];
    if (logs.length === 0) { document.getElementById("logsList").innerHTML = '<div class="empty">No logs yet</div>'; return; }
    var html = "";
    for (var i = 0; i < logs.length; i++) {
      var lg = logs[i];
      var cls = lg.success ? "success" : "fail";
      html += '<div class="log-entry ' + cls + '">';
      html += '<div class="log-action">' + escapeHtml(lg.action || "") + '</div>';
      if (lg.error_message) html += '<div class="log-detail">Error: ' + escapeHtml(lg.error_message) + '</div>';
      html += '<div class="log-time">' + new Date(lg.created_at).toLocaleString() + '</div>';
      html += '</div>';
    }
    document.getElementById("logsList").innerHTML = html;
  })
  .catch(function(e){ document.getElementById("logsList").innerHTML = '<div class="empty">Load failed: ' + e.message + '</div>'; });
}

function openCreateModal() {
  document.getElementById("newEmail").value = "";
  document.getElementById("newCode").value = generateCode();
  document.getElementById("newPayment").value = "Cash";
  document.getElementById("newNotes").value = "";
  document.getElementById("newReferredBy").value = "";
  document.getElementById("createModal").classList.remove("hidden");
}
function closeCreateModal() { document.getElementById("createModal").classList.add("hidden"); }
function generateCode() {
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  function block() { var s = ""; for (var i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)]; return s; }
  return "SPARKAI-" + block() + "-" + block() + "-" + block();
}
function createLicense() {
  var email = document.getElementById("newEmail").value.trim().toLowerCase();
  var code = document.getElementById("newCode").value.trim().toUpperCase();
  var payment = document.getElementById("newPayment").value;
  var notes = document.getElementById("newNotes").value.trim();
  var referredBy = document.getElementById("newReferredBy").value.trim().toLowerCase();
  if (!email || email.indexOf("@") < 0) { alert("Invalid email"); return; }
  var expIso = new Date(Date.now() + WEEK_MS).toISOString();
  callAdmin("create_license", {
    email: email, code: code, paidAmount: 150,
    paymentMethod: payment, notes: notes || null, referredBy: referredBy || null,
    expiresAt: expIso
  })
  .then(function(){
    var txt = "Email: " + email + "\nCode: " + code;
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).catch(function(){}); }
    if (referredBy && referredBy.indexOf("@") > 0) {
      callAdmin("apply_referral", { referrerEmail: referredBy, addMs: WEEK_MS })
      .then(function(rr){
        if (rr.referrerFound) { alert("✅ Cliente creado + premio!\n\n" + referredBy + " ganó 1 semana gratis."); }
        else { alert("⚠️ Cliente creado, PERO no se encontró al referido:\n" + referredBy + "\n\nRevisa el email. No se dio la semana gratis."); }
        closeCreateModal(); loadLicenses();
      })
      .catch(function(e){ alert("⚠️ Cliente creado, pero falló dar la semana: " + e.message); closeCreateModal(); loadLicenses(); });
    } else {
      alert("License created!\n\nCopiado al portapapeles:\n\n" + txt);
      closeCreateModal(); loadLicenses();
    }
  })
  .catch(function(e){ showError("Create failed: " + e.message); });
}
function escapeHtml(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function escapeAttr(s) { return String(s || "").replace(/'/g, "\\'").replace(/"/g, "&quot;"); }
