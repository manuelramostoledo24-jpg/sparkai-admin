<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SparkAI Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0e1a;
    color: #e8eaed;
    min-height: 100vh;
    padding-bottom: 100px;
  }
  /* PIN gate */
  #pinGate {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0a0e1a 0%, #1a1f3a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 9999;
    padding: 20px;
  }
  #pinGate.hidden { display: none; }
  .logo {
    font-size: 32px; font-weight: 800;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .tagline { color: #94a3b8; margin-bottom: 40px; font-size: 14px; }
  #pinInput {
    width: 200px; padding: 18px;
    font-size: 28px; text-align: center; letter-spacing: 12px;
    background: #1e293b; border: 2px solid #334155; border-radius: 12px;
    color: #fff; margin-bottom: 16px;
    outline: none;
  }
  #pinInput:focus { border-color: #22d3ee; }
  #pinBtn {
    width: 200px; padding: 14px;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    border: none; border-radius: 12px;
    color: #0a0e1a; font-weight: 700; font-size: 16px;
    cursor: pointer;
  }
  #pinError {
    color: #ef4444; margin-top: 12px; font-size: 14px; min-height: 20px;
  }
  /* App */
  #app { padding: 16px; max-width: 900px; margin: 0 auto; }
  #app.hidden { display: none; }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 22px;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .logout-btn {
    background: #1e293b; border: 1px solid #334155;
    color: #94a3b8; padding: 8px 14px; border-radius: 8px;
    font-size: 12px; cursor: pointer;
  }
  /* Stats */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin-bottom: 20px;
  }
  .stat {
    background: #1e293b; border-radius: 10px;
    padding: 12px 8px; text-align: center;
  }
  .stat-num { font-size: 22px; font-weight: 800; }
  .stat-label { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .stat.total .stat-num { color: #e8eaed; }
  .stat.active .stat-num { color: #4ade80; }
  .stat.expired .stat-num { color: #f59e0b; }
  .stat.blocked .stat-num { color: #ef4444; }
  /* Licenses */
  #licensesList { display: flex; flex-direction: column; gap: 12px; }
  .license-card {
    background: #1e293b; border-radius: 12px; padding: 16px;
    border-left: 4px solid #334155;
  }
  .license-card.active { border-left-color: #4ade80; }
  .license-card.expired { border-left-color: #f59e0b; }
  .license-card.blocked { border-left-color: #ef4444; }
  .lic-email { font-size: 14px; color: #e8eaed; margin-bottom: 4px; word-break: break-all; }
  .lic-code {
    font-family: "Courier New", monospace; font-size: 12px;
    color: #94a3b8; margin-bottom: 8px;
  }
  .lic-meta {
    display: flex; flex-wrap: wrap; gap: 8px;
    font-size: 11px; color: #94a3b8; margin-bottom: 10px;
  }
  .lic-meta span { background: #0f172a; padding: 4px 8px; border-radius: 6px; }
  .badge {
    display: inline-block; padding: 3px 8px; border-radius: 6px;
    font-size: 10px; font-weight: 700; text-transform: uppercase;
  }
  .badge.active { background: #064e3b; color: #4ade80; }
  .badge.expired { background: #78350f; color: #fbbf24; }
  .badge.blocked { background: #7f1d1d; color: #fca5a5; }
  .lic-actions {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
    margin-top: 10px;
  }
  .act-btn {
    padding: 8px; font-size: 12px; font-weight: 600;
    border: none; border-radius: 8px; cursor: pointer;
    background: #334155; color: #e8eaed;
  }
  .act-btn.renew { background: #064e3b; color: #4ade80; }
  .act-btn.block { background: #7f1d1d; color: #fca5a5; }
  .act-btn.unblock { background: #1e3a8a; color: #93c5fd; }
  .act-btn.reset { background: #422006; color: #fbbf24; }
  .act-btn.delete { background: #450a0a; color: #f87171; grid-column: span 2; }
  .act-btn.logs { background: #1e293b; color: #94a3b8; grid-column: span 2; border: 1px solid #334155; }
  /* FAB */
  .fab {
    position: fixed; bottom: 24px; right: 24px;
    width: 60px; height: 60px;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    border: none; border-radius: 50%;
    color: #0a0e1a; font-size: 32px; font-weight: 700;
    cursor: pointer; box-shadow: 0 8px 24px rgba(34, 211, 238, 0.4);
    z-index: 100;
  }
  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .modal-bg.hidden { display: none; }
  .modal {
    background: #1e293b; border-radius: 16px; padding: 24px;
    max-width: 400px; width: 100%; max-height: 80vh; overflow-y: auto;
  }
  .modal h2 { margin-bottom: 16px; font-size: 18px; }
  .modal input, .modal select {
    width: 100%; padding: 12px; margin-bottom: 12px;
    background: #0f172a; border: 1px solid #334155; border-radius: 8px;
    color: #e8eaed; font-size: 14px;
  }
  .modal-btns { display: flex; gap: 8px; margin-top: 12px; }
  .modal-btns button {
    flex: 1; padding: 12px; border: none; border-radius: 8px;
    font-weight: 700; cursor: pointer; font-size: 14px;
  }
  .btn-primary { background: linear-gradient(135deg, #4ade80, #22d3ee); color: #0a0e1a; }
  .btn-secondary { background: #334155; color: #e8eaed; }
  /* Loading & messages */
  #loading {
    text-align: center; padding: 40px 20px; color: #94a3b8;
  }
  #errorBanner {
    background: #7f1d1d; color: #fca5a5; padding: 12px;
    border-radius: 8px; margin-bottom: 12px; font-size: 13px;
  }
  #errorBanner.hidden { display: none; }
  .empty {
    text-align: center; padding: 40px 20px; color: #64748b;
  }
  .logs-list {
    max-height: 60vh; overflow-y: auto;
  }
  .log-entry {
    padding: 10px; background: #0f172a; border-radius: 6px;
    margin-bottom: 6px; font-size: 12px;
  }
  .log-entry.success { border-left: 3px solid #4ade80; }
  .log-entry.fail { border-left: 3px solid #ef4444; }
  .log-action { font-weight: 700; color: #e8eaed; }
  .log-time { color: #64748b; font-size: 10px; margin-top: 2px; }
  .log-detail { color: #94a3b8; margin-top: 4px; }
</style>
</head>
<body>

<!-- PIN GATE -->
<div id="pinGate">
  <div class="logo" translate="no">SparkAI</div>
  <div class="tagline" translate="no">Admin Panel</div>
  <input type="tel" id="pinInput" maxlength="4" placeholder="PIN" inputmode="numeric" autocomplete="off">
  <button id="pinBtn" type="button">UNLOCK</button>
  <div id="pinError"></div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <div class="header">
    <h1 translate="no">SparkAI Licenses</h1>
    <button class="logout-btn" type="button" onclick="logout()">Lock</button>
  </div>

  <div id="errorBanner" class="hidden"></div>

  <div class="stats">
    <div class="stat total"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total</div></div>
    <div class="stat active"><div class="stat-num" id="statActive">0</div><div class="stat-label">Active</div></div>
    <div class="stat expired"><div class="stat-num" id="statExpired">0</div><div class="stat-label">Expired</div></div>
    <div class="stat blocked"><div class="stat-num" id="statBlocked">0</div><div class="stat-label">Blocked</div></div>
  </div>

  <div id="loading">Loading licenses...</div>
  <div id="licensesList"></div>
</div>

<!-- FAB -->
<button class="fab hidden" id="fabBtn" type="button" onclick="openCreateModal()">+</button>

<!-- CREATE MODAL -->
<div class="modal-bg hidden" id="createModal">
  <div class="modal">
    <h2>New License</h2>
    <input type="email" id="newEmail" placeholder="client@email.com" autocomplete="off">
    <input type="text" id="newCode" readonly style="background:#0a0e1a;color:#22d3ee;font-family:monospace;">
    <select id="newPayment">
      <option value="Cash">Cash</option>
      <option value="Zelle">Zelle</option>
      <option value="CashApp">CashApp</option>
      <option value="Venmo">Venmo</option>
      <option value="Other">Other</option>
    </select>
    <input type="text" id="newNotes" placeholder="Notes (optional)">
    <div class="modal-btns">
      <button class="btn-secondary" type="button" onclick="closeCreateModal()">Cancel</button>
      <button class="btn-primary" type="button" onclick="createLicense()">Create ($100)</button>
    </div>
  </div>
</div>

<!-- LOGS MODAL -->
<div class="modal-bg hidden" id="logsModal">
  <div class="modal">
    <h2>Activity Log</h2>
    <div class="logs-list" id="logsList"></div>
    <div class="modal-btns">
      <button class="btn-secondary" type="button" onclick="closeLogsModal()">Close</button>
    </div>
  </div>
</div>

<script>
// =====================================================
// SparkAI Admin Panel - PIN: 4521
// =====================================================
"use strict";

var SUPABASE_URL = "https://gqgiiwqillinmunkprdi.supabase.co";
var SUPABASE_KEY = "sb_publishable_pivFIuIlTP0BbHxOLKCcVA_EPiWGd2D";
var ADMIN_PIN = "4521";
var WEEK_MS = 7 * 24 * 60 * 60 * 1000;

var licenses = [];

// ---------- PIN GATE ----------
function checkPin() {
  var input = document.getElementById("pinInput");
  var err = document.getElementById("pinError");
  var val = (input.value || "").trim();

  if (val === ADMIN_PIN) {
    try { sessionStorage.setItem("sparkai_unlocked", "1"); } catch(e){}
    document.getElementById("pinGate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("fabBtn").classList.remove("hidden");
    loadLicenses();
  } else {
    err.textContent = "Wrong PIN";
    input.value = "";
    input.focus();
  }
}

function logout() {
  try { sessionStorage.removeItem("sparkai_unlocked"); } catch(e){}
  location.reload();
}

// ---------- SUPABASE FETCH ----------
function sbHeaders(extra) {
  var h = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  };
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}

function showError(msg) {
  var el = document.getElementById("errorBanner");
  el.textContent = msg;
  el.classList.remove("hidden");
  setTimeout(function(){ el.classList.add("hidden"); }, 5000);
}

function loadLicenses() {
  document.getElementById("loading").style.display = "block";
  document.getElementById("licensesList").innerHTML = "";

  fetch(SUPABASE_URL + "/rest/v1/licenses?select=*&order=created_at.desc", {
    headers: sbHeaders()
  })
  .then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function(data){
    licenses = data || [];
    renderLicenses();
  })
  .catch(function(e){
    showError("Load failed: " + e.message);
    document.getElementById("loading").textContent = "Failed to load. Check connection.";
  });
}

function renderLicenses() {
  document.getElementById("loading").style.display = "none";
  var list = document.getElementById("licensesList");

  var now = Date.now();
  var total = licenses.length;
  var active = 0, expired = 0, blocked = 0;

  for (var i = 0; i < licenses.length; i++) {
    var L = licenses[i];
    if (L.status === "blocked") blocked++;
    else if (L.status === "expired") expired++;
    else if (L.status === "active") {
      var exp = L.expires_at ? new Date(L.expires_at).getTime() : 0;
      if (exp && exp < now) expired++; else active++;
    }
  }

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statActive").textContent = active;
  document.getElementById("statExpired").textContent = expired;
  document.getElementById("statBlocked").textContent = blocked;

  if (total === 0) {
    list.innerHTML = '<div class="empty">No licenses yet. Tap + to create one.</div>';
    return;
  }

  var html = "";
  for (var j = 0; j < licenses.length; j++) {
    html += renderCard(licenses[j], now);
  }
  list.innerHTML = html;
}

function renderCard(L, now) {
  var status = L.status || "unknown";
  var statusClass = status;
  var expMs = L.expires_at ? new Date(L.expires_at).getTime() : 0;
  if (status === "active" && expMs && expMs < now) {
    status = "expired"; statusClass = "expired";
  }

  var daysLeft = "";
  if (status === "active" && expMs) {
    var d = Math.max(0, Math.ceil((expMs - now) / 86400000));
    daysLeft = d + "d left";
  } else if (status === "expired") {
    daysLeft = "Expired";
  } else if (status === "blocked") {
    daysLeft = "Blocked";
  }

  var paid = L.paid_amount || 0;
  var device = L.device_name || "Not bound";
  var created = L.created_at ? new Date(L.created_at).toLocaleDateString() : "";

  var actions = "";
  if (status === "blocked") {
    actions += '<button class="act-btn unblock" onclick="unblockLicense(\'' + L.id + '\')">Unblock</button>';
  } else {
    actions += '<button class="act-btn renew" onclick="renewLicense(\'' + L.id + '\')">Renew +$30</button>';
    actions += '<button class="act-btn block" onclick="blockLicense(\'' + L.id + '\')">Block</button>';
  }
  if (L.device_id) {
    actions += '<button class="act-btn reset" onclick="resetDevice(\'' + L.id + '\')">Reset Device</button>';
  }
  actions += '<button class="act-btn logs" onclick="viewLogs(\'' + escapeAttr(L.email) + '\')">View Logs</button>';
  actions += '<button class="act-btn delete" onclick="deleteLicense(\'' + L.id + '\',\'' + escapeAttr(L.email) + '\')">Delete</button>';

  return (
    '<div class="license-card ' + statusClass + '">' +
      '<div class="lic-email">' + escapeHtml(L.email || "") + '</div>' +
      '<div class="lic-code">' + escapeHtml(L.code || "") + '</div>' +
      '<div class="lic-meta">' +
        '<span class="badge ' + statusClass + '">' + status + '</span>' +
        '<span>' + daysLeft + '</span>' +
        '<span>$' + paid + '</span>' +
        '<span>' + escapeHtml(device) + '</span>' +
        '<span>Created: ' + created + '</span>' +
      '</div>' +
      '<div class="lic-actions">' + actions + '</div>' +
    '</div>'
  );
}

// ---------- ACTIONS ----------
function renewLicense(id) {
  if (!confirm("Renew this license for +7 days and $30?")) return;
  var L = licenses.find(function(x){ return x.id === id; });
  if (!L) return;

  var base = (L.expires_at && new Date(L.expires_at).getTime() > Date.now())
    ? new Date(L.expires_at).getTime()
    : Date.now();
  var newExp = new Date(base + WEEK_MS).toISOString();
  var newPaid = (L.paid_amount || 0) + 30;

  fetch(SUPABASE_URL + "/rest/v1/licenses?id=eq." + id, {
    method: "PATCH",
    headers: sbHeaders({ "Prefer": "return=representation" }),
    body: JSON.stringify({
      status: "active",
      expires_at: newExp,
      paid_amount: newPaid
    })
  })
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(function(){ logEvent(L.email, L.id, "renew", true, null); loadLicenses(); })
  .catch(function(e){ showError("Renew failed: " + e.message); });
}

function blockLicense(id) {
  if (!confirm("Block this client? The app will sign out within 30 min.")) return;
  var L = licenses.find(function(x){ return x.id === id; });
  fetch(SUPABASE_URL + "/rest/v1/licenses?id=eq." + id, {
    method: "PATCH",
    headers: sbHeaders(),
    body: JSON.stringify({ status: "blocked" })
  })
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); })
  .then(function(){ if(L) logEvent(L.email, L.id, "blocked_by_admin", true, null); loadLicenses(); })
  .catch(function(e){ showError("Block failed: " + e.message); });
}

function unblockLicense(id) {
  if (!confirm("Unblock this license?")) return;
  var L = licenses.find(function(x){ return x.id === id; });
  fetch(SUPABASE_URL + "/rest/v1/licenses?id=eq." + id, {
    method: "PATCH",
    headers: sbHeaders(),
    body: JSON.stringify({ status: "active" })
  })
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); })
  .then(function(){ if(L) logEvent(L.email, L.id, "unblocked_by_admin", true, null); loadLicenses(); })
  .catch(function(e){ showError("Unblock failed: " + e.message); });
}

function resetDevice(id) {
  if (!confirm("Reset device binding? Client can re-activate on a new device.")) return;
  var L = licenses.find(function(x){ return x.id === id; });
  fetch(SUPABASE_URL + "/rest/v1/licenses?id=eq." + id, {
    method: "PATCH",
    headers: sbHeaders(),
    body: JSON.stringify({ device_id: null, device_name: null })
  })
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); })
  .then(function(){ if(L) logEvent(L.email, L.id, "device_reset", true, null); loadLicenses(); })
  .catch(function(e){ showError("Reset failed: " + e.message); });
}

function deleteLicense(id, email) {
  if (!confirm("DELETE license for " + email + "?\n\nTIP: Prefer BLOCK over DELETE. Delete removes history.")) return;
  if (!confirm("Are you SURE? This cannot be undone.")) return;

  fetch(SUPABASE_URL + "/rest/v1/licenses?id=eq." + id, {
    method: "DELETE",
    headers: sbHeaders()
  })
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); })
  .then(function(){ loadLicenses(); })
  .catch(function(e){ showError("Delete failed: " + e.message); });
}

// ---------- LOGS ----------
function viewLogs(email) {
  document.getElementById("logsModal").classList.remove("hidden");
  document.getElementById("logsList").innerHTML = "Loading...";

  fetch(SUPABASE_URL + "/rest/v1/license_logs?email=eq." + encodeURIComponent(email) + "&order=created_at.desc&limit=50", {
    headers: sbHeaders()
  })
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(function(logs){
    if (!logs || logs.length === 0) {
      document.getElementById("logsList").innerHTML = '<div class="empty">No logs yet</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < logs.length; i++) {
      var lg = logs[i];
      var cls = lg.success ? "success" : "fail";
      html += '<div class="log-entry ' + cls + '">';
      html += '<div class="log-action">' + escapeHtml(lg.action || "") + '</div>';
      if (lg.device_name) html += '<div class="log-detail">' + escapeHtml(lg.device_name) + '</div>';
      if (lg.error_message) html += '<div class="log-detail">Error: ' + escapeHtml(lg.error_message) + '</div>';
      html += '<div class="log-time">' + new Date(lg.created_at).toLocaleString() + '</div>';
      html += '</div>';
    }
    document.getElementById("logsList").innerHTML = html;
  })
  .catch(function(e){
    document.getElementById("logsList").innerHTML = '<div class="empty">Load failed: ' + e.message + '</div>';
  });
}

function closeLogsModal() {
  document.getElementById("logsModal").classList.add("hidden");
}

function logEvent(email, licenseId, action, success, errorMsg) {
  fetch(SUPABASE_URL + "/rest/v1/license_logs", {
    method: "POST",
    headers: sbHeaders(),
    body: JSON.stringify({
      license_id: licenseId,
      email: email,
      action: action,
      success: success,
      error_message: errorMsg
    })
  }).catch(function(){});
}

// ---------- CREATE ----------
function openCreateModal() {
  document.getElementById("newEmail").value = "";
  document.getElementById("newCode").value = generateCode();
  document.getElementById("newPayment").value = "Cash";
  document.getElementById("newNotes").value = "";
  document.getElementById("createModal").classList.remove("hidden");
}

function closeCreateModal() {
  document.getElementById("createModal").classList.add("hidden");
}

function generateCode() {
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no confusable chars
  function block() {
    var s = "";
    for (var i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }
  return "SPARKAI-" + block() + "-" + block() + "-" + block();
}

function createLicense() {
  var email = document.getElementById("newEmail").value.trim().toLowerCase();
  var code = document.getElementById("newCode").value.trim().toUpperCase();
  var payment = document.getElementById("newPayment").value;
  var notes = document.getElementById("newNotes").value.trim();

  if (!email || email.indexOf("@") < 0) {
    alert("Invalid email");
    return;
  }

  var nowIso = new Date().toISOString();
  var expIso = new Date(Date.now() + WEEK_MS).toISOString();

  fetch(SUPABASE_URL + "/rest/v1/licenses", {
    method: "POST",
    headers: sbHeaders({ "Prefer": "return=representation" }),
    body: JSON.stringify({
      email: email,
      code: code,
      status: "active",
      paid_amount: 100,
      payment_method: payment,
      notes: notes || null,
      activated_at: null,
      expires_at: expIso,
      created_at: nowIso
    })
  })
  .then(function(r){
    if (!r.ok) return r.text().then(function(t){ throw new Error(t); });
    return r.json();
  })
  .then(function(){
    var txt = "Email: " + email + "\nCode: " + code;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).catch(function(){});
    }
    alert("License created!\n\nCopied to clipboard:\n\n" + txt);
    closeCreateModal();
    loadLicenses();
  })
  .catch(function(e){ showError("Create failed: " + e.message); });
}

// ---------- HELPERS ----------
function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function escapeAttr(s) {
  return String(s || "").replace(/'/g, "\\'").replace(/"/g, "&quot;");
}

// ---------- INIT ----------
(function init() {
  // Auto-unlock if already authenticated this session
  try {
    if (sessionStorage.getItem("sparkai_unlocked") === "1") {
      document.getElementById("pinGate").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      document.getElementById("fabBtn").classList.remove("hidden");
      loadLicenses();
      return;
    }
  } catch(e){}

  // Wire PIN entry
  var btn = document.getElementById("pinBtn");
  var input = document.getElementById("pinInput");
  btn.addEventListener("click", checkPin);
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter") checkPin();
  });
  input.focus();
})();
</script>
